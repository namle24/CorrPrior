name: CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu-validation.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check extracted release
        run: python scripts/check_release.py
