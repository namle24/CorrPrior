<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="566" viewBox="0 0 1440 566" role="img" aria-labelledby="title description">
<title id="title">CorrPrior: reported PSNR effects and paired 95% confidence intervals</title>
<desc id="description">Left: matched model comparisons on RealSR and SVSR. Right: feature interventions on one fixed CorrPrior checkpoint on RealSR. Positive values favor the first model or the original aligned features. The panels have different x-axis ranges. Interventions are not trained-baseline gains.</desc>
