name: journal_RN_PD_MAE_DRCT_x4_finetune_100k
model_type: DRCTModel
scale: 4
num_gpu: 1
manual_seed: 0
mae_weight: 0.0
output_root: runs/drct

datasets:
  train:
    name: DF2K-OST-MultiLevel
    type: MultiLevelPairedImageDataset
    dataroot_gt: data/train/HR_sub
    # BasicSR 1.4 expands dataroot_lq as one path before dataset creation.
    # Keep it null and let the registered multi-level loader consume the list.
    dataroot_lq: ~
    dataroot_lq_levels:
      - data/train/LR_90ugly_sub
      - data/train/LR_80ugly_sub
      - data/train/LR_70ugly_sub
      - data/train/LR_60ugly_sub
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_g:
  type: DRCT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.0
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: pixelshuffle
  resi_connection: 1conv
  use_sft: true
  use_restoration_need_gate: true
  restoration_need_gate_mode: spatial
  zero_init_sft: true
  allow_random_prior: false
  # Supplied at launch from the final source-disjoint selection JSON.
  mae_checkpoint: ~
  mae_input_upscale: 4
  mae_tile_batch_size: 8
  mae_tile_overlap: 64

path:
  pretrain_network_g: checkpoints/drct_base_500k.pth
  param_key_g: params_ema
  strict_load_g: false
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [50000, 80000, 90000]
    gamma: 0.5
  total_iter: 100000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      "conv3_4": 1.0
      "conv4_4": 1.0
      "conv5_4": 1.0
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: !!float 1e-2
    style_weight: 0
    range_norm: false
    criterion: l1

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2.5e4
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
